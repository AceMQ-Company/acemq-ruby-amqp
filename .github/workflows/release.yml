# Verify a tag, build the gem, and add it to the AceMQ gem feed.
#
# # Where this publishes, and why not rubygems.org
#
# The gem goes to AceMQ-Company/gems, a static feed served at
# https://acemq.org/gems/, alongside the Maven repository and the NuGet feed
# that already work this way. It does not go to rubygems.org.
#
# That is deliberate and it is about reversibility. A gem name on rubygems.org
# is permanent and a pushed version cannot really be withdrawn — a yank hides it
# from the index but does not free the version number and does not remove it
# from anybody who already has it. Publishing here first means a release can be
# corrected by deleting a file and re-indexing, which is the property worth
# having while the library is pre-1.0. Moving to rubygems.org later changes
# nothing for consumers except the source line.
#
# # Publishing credentials
#
# GEMS_REPO_DEPLOY_KEY: an SSH deploy key with write access to
# AceMQ-Company/gems and to nothing else in the organisation. A deploy key
# rather than a token because a token carries its owner's reach across every
# repository they can see, and this job needs exactly one.
#
# # No notification
#
# This workflow tells nobody. A release that is not on a public registry is not
# news to announce, and the run itself is the record.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # The floor this gem promises, not the newest. Releasing something
          # that only works on a newer Ruby would break the promise in the
          # gemspec.
          ruby-version: '3.1'
          bundler-cache: true

      - name: Check the tag is a 0.1.x version
        # The line stays on 0.1.x until that is deliberately changed. Without
        # this a mistyped tag becomes a version number that cannot be reused.
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          case "$version" in
            0.3.*) echo "releasing $version" ;;
            *)
              echo "::error::this library releases 0.3.x only; '$version' needs the guard in release.yml lifted first"
              exit 1
              ;;
          esac

      - name: Check the version constant matches the tag
        # A gem whose VERSION disagrees with its tag is a gem nobody can trace
        # back to a commit, and `gem install acemq-amqp -v 0.1.1` would install
        # something calling itself something else.
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          declared=$(ruby -Ilib -racemq/amqp/version -e 'print AceMQ::AMQP::VERSION')
          if [ "$declared" != "$version" ]; then
            echo "::error::the tag is $version but AceMQ::AMQP::VERSION is $declared"
            exit 1
          fi
          echo "AceMQ::AMQP::VERSION is $declared"

      - name: Test and lint
        run: |
          bundle exec rspec
          bundle exec rubocop

      - name: Build the gem
        run: gem build acemq-amqp.gemspec

      - name: Check the gem carries what it says it does
        # gemspec.files is a Dir glob, so a new directory under lib/ is included
        # by luck rather than by decision. A gem missing half its library
        # installs perfectly and fails at require time in somebody else's
        # process.
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          contents=$(tar -xOf "acemq-amqp-$version.gem" data.tar.gz | tar -tzf -)
          echo "$contents"
          for required in LICENSE README.md lib/acemq/amqp.rb lib/acemq/amqp/connection.rb \
                          lib/acemq/amqp/interceptors.rb lib/acemq/amqp/telemetry.rb \
                          lib/acemq/amqp/health.rb lib/acemq/amqp/retry_ladder.rb; do
            if ! printf '%s\n' "$contents" | grep -qx "$required"; then
              echo "::error::the built gem does not contain $required"
              exit 1
            fi
          done

      - name: Check it installs and loads on its own
        # Installed into a clean prefix with no development gems anywhere near
        # it, because the one thing a unit test cannot catch is a require this
        # repository satisfies from its own Gemfile.
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          GEM_HOME="$RUNNER_TEMP/clean" gem install --no-document "acemq-amqp-$version.gem"
          GEM_HOME="$RUNNER_TEMP/clean" ruby -e '
            gem "acemq-amqp"
            require "acemq/amqp"
            require "acemq/amqp/patterns"
            abort "the gem reports the wrong version" unless AceMQ::AMQP::VERSION.is_a?(String)
            AceMQ::AMQP::Topology.new.queue("orders.new", dead_letter: true).plan
            puts "acemq-amqp #{AceMQ::AMQP::VERSION} loads with no development gems present"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: '*.gem'
          if-no-files-found: error

  integration:
    name: against a real broker
    runs-on: ubuntu-latest
    services:
      broker:
        image: rabbitmq:4-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Test against the broker
        env:
          ACEMQ_TEST_BROKER: amqp://guest:guest@localhost:5672
        run: |
          set -o pipefail
          bundle exec rspec --tag integration --format documentation \
            2>&1 | tee "$RUNNER_TEMP/broker-specs.log"

      - name: Check nothing skipped
        # spec_helper skips every integration example when ACEMQ_TEST_BROKER is
        # unset, and an unset variable looks exactly like a passing run. A
        # release that silently tested nothing against a broker is the failure
        # worth spending five lines on.
        run: |
          log="$RUNNER_TEMP/broker-specs.log"
          if grep -qE '^[0-9]+ examples, 0 failures, [0-9]+ pending' "$log"; then
            echo "::warning::some examples were pending"
          fi
          examples=$(grep -oE '^[0-9]+ examples' "$log" | grep -oE '[0-9]+' | tail -1)
          if [ -z "$examples" ] || [ "$examples" -lt 15 ]; then
            echo "::error::only ${examples:-0} integration examples ran; expected at least 15"
            exit 1
          fi
          echo "$examples integration examples ran"

  publish:
    needs: [verify, integration]
    # Tags only. A manual dispatch runs the checks against a branch and stops
    # short of publishing, which is what makes this workflow safe to try out.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: gems
      url: https://acemq.org/gems/
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # 3.1 is the floor the gem supports and the right thing to build on,
          # but the RubyGems that ships with it writes only the classic index --
          # no versions, no info/, no names. A current client reads the compact
          # index first, so a feed built by the old generator looks empty to it
          # while looking perfectly correct to the generator that made it. That
          # is exactly how 0.2.0 went out resolvable by CI's Ruby and not by a
          # developer's. `rubygems: latest` upgrades the tool without moving off
          # the floor.
          ruby-version: '3.1'
          rubygems: latest
          bundler-cache: true

      - name: Work out the version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          declared=$(ruby -Ilib -racemq/amqp/version -e 'print AceMQ::AMQP::VERSION')
          if [ "$VERSION" != "$declared" ]; then
            echo "::error::the tag is $VERSION but AceMQ::AMQP::VERSION is $declared"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the gem
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gem build acemq-amqp.gemspec -o "$RUNNER_TEMP/acemq-amqp-$VERSION.gem"

      - name: Check out the gem feed
        uses: actions/checkout@v4
        with:
          repository: AceMQ-Company/gems
          # A deploy key rather than a token: write access to that repository
          # alone, and to nothing else in the organisation.
          ssh-key: ${{ secrets.GEMS_REPO_DEPLOY_KEY }}
          path: gem-feed

      - name: Add the gem to it
        # Cloned first, then added to, so the index is regenerated over
        # everything already published. Building it from this release alone
        # would leave earlier versions on disk and invisible to any client.
        working-directory: gem-feed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/publish.sh "$RUNNER_TEMP/acemq-amqp-$VERSION.gem"

      # `published` is the line between "nothing happened" and "something is out
      # there". Everything before this leaves the feed untouched; everything
      # after operates on a version consumers can already resolve.
      - name: Commit and push
        working-directory: gem-feed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "acemq-release"
          git config user.email "noreply@acemq.org"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish; $VERSION may already be in the feed"
            exit 0
          fi
          git add -A
          git commit -m "Publish acemq-amqp $VERSION"
          git push origin HEAD

      - name: Install it back out of the feed
        # The feed is only real if a client can resolve from it. GitHub Pages
        # takes a moment to serve a new commit, so this retries rather than
        # racing the deploy.
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # The same RubyGems a consumer on a current Ruby has, so this
          # resolves through the compact index rather than the classic one.
          gem update --system --silent
          export GEM_HOME="$RUNNER_TEMP/verify-gems"
          for attempt in $(seq 1 20); do
            if gem install acemq-amqp -v "$VERSION" \
                 --source https://acemq.org/gems/ --no-document >/dev/null 2>&1; then
              ruby -e 'gem "acemq-amqp"; require "acemq/amqp"; puts AceMQ::AMQP::VERSION' \
                | grep -qx "$VERSION"
              echo "installed acemq-amqp $VERSION from the feed"
              exit 0
            fi
            sleep 15
          done
          echo "::error::the feed did not serve acemq-amqp $VERSION within five minutes"
          exit 1
