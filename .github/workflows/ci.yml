# Build and test on every Ruby this library promises to run on.
#
# The contract layer has no dependencies and needs no broker, so it runs on the
# whole matrix and takes seconds. When the transport lands, anything needing a
# broker gets its own job against a service container, run once — running it
# four times would learn the same thing four times.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.1 is the floor; the rest are what people actually run.
        ruby: ['3.1', '3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test
        run: bundle exec rspec

      - name: Lint
        run: bundle exec rubocop

  # There is no integration job yet, deliberately. The transport does not exist,
  # so there are no tests that need a broker -- and a job that starts RabbitMQ to
  # run nothing is a green tick that means nothing. It comes back with the
  # transport, along with the tests that justify it.
