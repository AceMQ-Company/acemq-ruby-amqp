# Build the documentation site and publish it to GitHub Pages.
#
# The site is the README rendered as the front page plus the API reference under
# /api/, generated by YARD from the comments in lib/. The reference is part of
# the site rather than an afterthought: this gem has nothing on rubygems.org
# hosting one for it, and generating it from the same commit as the prose is
# what stops the two drifting apart.
#
# docs/**/*.md is rendered too when there is any. There is none yet, and the
# path is a trigger already so that adding a page is adding a page.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'lib/**'
      - '.github/workflows/docs.yml'
      - '.github/scripts/build-docs-site.sh'
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a waiting one rather than
# racing it. In-progress runs are allowed to finish so a half-published site is
# never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege for every job that does not ask for more. Jobs needing more
# declare it themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # The floor this library promises, so the reference is generated by
          # the oldest Ruby that can run the code it describes.
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Render the pages
        # yard comes from the Gemfile's development group, so the version that
        # renders the reference is the version bundler resolved rather than
        # whatever the runner happened to have.
        run: bundle exec bash .github/scripts/build-docs-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A job's own block replaces the workflow default rather than adding to it,
    # so contents is repeated here. This is GitHub's own deploy-pages triple.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    # Failures only, matching the Java, Go and .NET repositories. A message for
    # every push to main would be noise nobody reads, and a channel people mute
    # is worse than no channel.
    #
    # With SLACK_DELIVERY_WEBHOOK absent this does nothing and succeeds, so it
    # is inert until the secret is added.
    if: always() && needs.deploy.result == 'failure'
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.deploy.result }}
      title: "AceMQ for Ruby documentation build FAILED"
      message: "The site was not updated, so it still shows the previous version."
      url: https://acemq-company.github.io/acemq-ruby-amqp/
    secrets:
      # Explicit, not `inherit`. A reusable workflow in another repository does
      # not receive inherited secrets, and the shared workflow treats a missing
      # webhook as "nothing to notify" and succeeds — so `inherit` here would be
      # a green job that announced nothing.
      SLACK_DELIVERY_WEBHOOK: ${{ secrets.SLACK_DELIVERY_WEBHOOK }}
