# Build the documentation site and publish it to GitHub Pages.
#
# The site is docs/*.md rendered by pandoc plus the API reference under /api/,
# generated by YARD from the comments in lib/. The reference is part of the site
# rather than an afterthought: this gem has nothing on rubygems.org hosting one
# for it, and generating it from the same commit as the prose is what stops the
# two drifting apart.
#
# The README is not part of the site. It is written for somebody looking at the
# repository — badges, build instructions, a status note — and the front page is
# docs/index.md, written for somebody trying to use the library. So a README-only
# change no longer rebuilds anything, and is not a trigger here.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'lib/**'
      - '.github/workflows/docs.yml'
      - '.github/scripts/build-docs-site.sh'
      # The API reference's front page, which is a file rather than the README
      # for the reason build-docs-site.sh explains.
      - '.github/api-index.md'
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a waiting one rather than
# racing it. In-progress runs are allowed to finish so a half-published site is
# never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege for every job that does not ask for more. Jobs needing more
# declare it themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # The floor this library promises, so the reference is generated by
          # the oldest Ruby that can run the code it describes.
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Render the pages
        # yard comes from the Gemfile's development group, so the version that
        # renders the reference is the version bundler resolved rather than
        # whatever the runner happened to have.
        run: bundle exec bash .github/scripts/build-docs-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A job's own block replaces the workflow default rather than adding to it,
    # so contents is repeated here. This is GitHub's own deploy-pages triple.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
