AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - vendor/**/*
    - .bundle/**/*

# The house style everywhere else in AceMQ: comments explain why, and a
# paragraph that earns its place is worth more than a line under 80 columns.
Layout/LineLength:
  Max: 96

# Double quotes throughout. Every file here is frozen_string_literal, the
# header names are the wire contract and are quoted the same way in the four
# other languages, and one rule applied everywhere beats two applied by
# whether a string happens to interpolate.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - "*.gemspec"

# An envelope has ten fields because the contract has ten headers. Splitting
# the constructor to satisfy a counter would hide that rather than simplify it.
Metrics/ParameterLists:
  Enabled: false
Metrics/MethodLength:
  Max: 30
# Envelope.from_headers reads ten headers into ten fields and does nothing
# else. It scores 31 because the contract has ten headers, and breaking it into
# two halves to score 15 twice would hide the one thing worth seeing: the whole
# mapping, in one place, next to the names it maps.
Metrics/AbcSize:
  Max: 35
Metrics/ClassLength:
  Max: 200

# The specs name the fixtures at the top level on purpose: they are the
# contract, and reading them should not require unpicking a let block.
Lint/ConstantDefinitionInBlock:
  Enabled: false
Naming/FileName:
  Exclude:
    - lib/acemq-amqp.rb
