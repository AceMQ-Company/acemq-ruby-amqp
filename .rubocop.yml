AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - vendor/**/*
    - .bundle/**/*

# The house style everywhere else in AceMQ: comments explain why, and a
# paragraph that earns its place is worth more than a line under 80 columns.
Layout/LineLength:
  Max: 96

# Double quotes throughout. Every file here is frozen_string_literal, the
# header names are the wire contract and are quoted the same way in the four
# other languages, and one rule applied everywhere beats two applied by
# whether a string happens to interpolate.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - "*.gemspec"

# An envelope has ten fields because the contract has ten headers. Splitting
# the constructor to satisfy a counter would hide that rather than simplify it.
Metrics/ParameterLists:
  Enabled: false
Metrics/MethodLength:
  Max: 30
# Envelope.from_headers reads ten headers into ten fields and does nothing
# else. It scores 31 because the contract has ten headers, and breaking it into
# two halves to score 15 twice would hide the one thing worth seeing: the whole
# mapping, in one place, next to the names it maps.
Metrics/AbcSize:
  Max: 35
Metrics/ModuleLength:
  Exclude:
    # Generating a certificate is a fixed list of fields, extensions and files,
    # and the list is the contract: the subject alternative names, the key
    # usages and the six filenames all have to match what the Go, Java and .NET
    # generators write or the certificates are not interchangeable. Splitting it
    # to score under a hundred twice would put half that list in each half.
    - lib/acemq/amqp/dev_certificates.rb

Metrics/ClassLength:
  Max: 200
  Exclude:
    # The TOML reader is a grammar, not a class that grew. It is long because
    # TOML has four kinds of date, three kinds of string and four bases for an
    # integer, and every method in it is a production of that grammar. Splitting
    # it in two to score 114 twice would put half a grammar in each half and
    # make it harder, not easier, to check against the specification.
    - lib/acemq/amqp/codec/toml/reader.rb
    # The tracing adapter is a surface, not a class that grew: three spans, four
    # events, thirteen attributes, six interceptor hooks and a scope, every one
    # of them named identically in the Java, Go, .NET and Python adapters
    # because a polyglot estate is watched on one dashboard. Splitting it would
    # put half of that contract in another file without removing a line of it,
    # and the one place to read "what does this library emit" would become two.
    - lib/acemq/amqp/telemetry/open_telemetry.rb

# The specs name the fixtures at the top level on purpose: they are the
# contract, and reading them should not require unpicking a let block.
Lint/ConstantDefinitionInBlock:
  Enabled: false

# StringScanner#scan, #skip and #check only began taking a String in strscan
# 3.1.0, and Ruby 3.1 — the floor this gem promises and the first entry in the
# CI matrix — ships strscan 3.0.1, where a String raises TypeError. The cop does
# not know that, so the TOML reader keeps its regexps and this says why rather
# than leaving somebody to autocorrect it back and find out on CI.
Style/RedundantRegexpArgument:
  Exclude:
    - lib/acemq/amqp/codec/toml/reader.rb
Naming/FileName:
  Exclude:
    - lib/acemq-amqp.rb
